name: AIMS Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.7, 3.8, 3.9]

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v3
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install pipenv
      run: |
        python -m pip install --upgrade pip
        pip install pipenv

    - name: Install dependencies
      run: |
        pipenv install --dev --system

    - name: Install additional test dependencies
      run: |
        pip install pytest pytest-cov

    - name: Lint with flake8 (if available)
      run: |
        pip install flake8
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
      continue-on-error: true

    - name: Test with unittest
      run: |
        python -m unittest discover tests -v

    - name: Run Android-specific tests
      run: |
        python -m unittest tests.test_android -v

    - name: Test server startup (smoke test)
      run: |
        timeout 10 python aims/server.py || true
      env:
        FLASK_ENV: testing

    - name: Generate coverage report
      run: |
        coverage run -m unittest discover tests
        coverage xml
      continue-on-error: true

    - name: Upload coverage to Codecov (if available)
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        fail_ci_if_error: false
      continue-on-error: true